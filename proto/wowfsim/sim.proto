syntax = "proto3";

package wowfsim;

option go_package = "wowf-sim/engine/gen/wowfsim";

// SimRequest is the only input the UI sends into the Go engine.
message SimRequest {
  Player player = 1;
  Encounter encounter = 2;
  SimOptions options = 3;
}

message Player {
  string name = 1;
  Class class = 2;
  Race race = 3;
  int32 level = 4;
  Gear gear = 5;
}

message Gear {
  repeated EquippedItem items = 1;
}

message EquippedItem {
  int32 id = 1;
  string name = 2;
  ItemSlot slot = 3;
}

message Encounter {
  double duration_seconds = 1;
}

message SimOptions {
  int32 iterations = 1;
  int64 rng_seed = 2;
}

message SimResult {
  double dps_mean = 1;
  double dps_stdev = 2;
  double dps_min = 3;
  double dps_max = 4;
  int32 iterations = 5;
  repeated ActionMetric actions = 6;
}

message ActionMetric {
  string name = 1;
  double dps = 2;
  int64 casts = 3;
}

enum Class {
  CLASS_UNSPECIFIED = 0;
  CLASS_WARRIOR = 1;
  CLASS_PALADIN = 2;
  CLASS_HUNTER = 3;
  CLASS_ROGUE = 4;
  CLASS_PRIEST = 5;
  CLASS_SHAMAN = 6;
  CLASS_MAGE = 7;
  CLASS_WARLOCK = 8;
  CLASS_DRUID = 9;
}

enum Race {
  RACE_UNSPECIFIED = 0;
  RACE_HUMAN = 1;
  RACE_ORC = 2;
  RACE_DWARF = 3;
  RACE_NIGHT_ELF = 4;
  RACE_UNDEAD = 5;
  RACE_TAUREN = 6;
  RACE_GNOME = 7;
  RACE_TROLL = 8;
  RACE_SKYBORNE = 9;
}

enum ItemSlot {
  ITEM_SLOT_UNSPECIFIED = 0;
  ITEM_SLOT_HEAD = 1;
  ITEM_SLOT_NECK = 2;
  ITEM_SLOT_SHOULDER = 3;
  ITEM_SLOT_BACK = 4;
  ITEM_SLOT_CHEST = 5;
  ITEM_SLOT_WRIST = 6;
  ITEM_SLOT_HANDS = 7;
  ITEM_SLOT_WAIST = 8;
  ITEM_SLOT_LEGS = 9;
  ITEM_SLOT_FEET = 10;
  ITEM_SLOT_FINGER_1 = 11;
  ITEM_SLOT_FINGER_2 = 12;
  ITEM_SLOT_TRINKET_1 = 13;
  ITEM_SLOT_TRINKET_2 = 14;
  ITEM_SLOT_MAIN_HAND = 15;
  ITEM_SLOT_OFF_HAND = 16;
  ITEM_SLOT_RANGED = 17;
}
