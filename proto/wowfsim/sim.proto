syntax = "proto3";

package wowfsim;

option go_package = "wowf-sim/engine/gen/wowfsim";

// SimRequest is the only input the UI sends into the Go engine.
message SimRequest {
  Player player = 1;
  Encounter encounter = 2;
  SimOptions options = 3;
}

message Player {
  string name = 1;
  Class class = 2;
  Race race = 3;
  int32 level = 4;
  Gear gear = 5;
  repeated TalentPick talents = 6;
  repeated string raid_buffs = 7;
  BonusStats bonus_stats = 8;
  // Rotation APL order. Higher priority is tried first. Missing IDs keep catalog defaults.
  repeated AbilityPriority ability_priorities = 9;
  // Warrior DPS stance. Other classes ignore this. Unspecified is Berserker.
  WarriorStance stance = 10;
  // Wowhead Forever potion item id. 0 means none. Used off GCD like a trinket.
  int32 combat_potion = 11;
  // Consumable weapon temp id (sharpening stone / weightstone). Empty means none.
  string mh_weapon_temp = 12;
  string oh_weapon_temp = 13;
  // Used at 20% target health. Missing IDs keep ability_priorities.
  repeated AbilityPriority execute_ability_priorities = 14;
}

message AbilityPriority {
  string id = 1;
  int32 priority = 2;
}

// Extra stats added after gear, before raid multipliers. Used for EP measurement.
message BonusStats {
  double strength = 1;
  double agility = 2;
  double intellect = 3;
  double attack_power = 4;
  double spell_power = 5;
  double crit_chance = 6;
  double hit_chance = 7;
  double spell_crit_chance = 8;
  double spell_hit_chance = 9;
  double weapon_dps = 10;
}

message Gear {
  repeated EquippedItem items = 1;
}

message EquippedItem {
  int32 id = 1;
  string name = 2;
  ItemSlot slot = 3;
  double weapon_dps = 4;
  int32 attack_speed_ms = 5;
  int32 strength = 6;
  int32 agility = 7;
  int32 attack_power = 8;
  double crit_chance = 9;
  string item_subclass = 10;
  double hit_chance = 11;
  string hand = 12;
  int32 intellect = 13;
  int32 spell_power = 14;
  double spell_crit_chance = 15;
  double spell_hit_chance = 16;
  // Wowhead Forever enhancement item id (permanent or temporary). 0 means none.
  int32 enchant_id = 18;
  // Proc / on-use effects. The UI sends these so WASM does not embed the item catalog.
  repeated ItemEffect effects = 19;
}

message ItemEffect {
  string kind = 1;
  string name = 2;
  string text = 3;
  double attack_power = 4;
  double spell_power = 5;
  double haste = 6;
  double crit = 7;
  double strength = 8;
  double agility = 9;
  double armor_ignore = 10;
  double rage = 11;
  double duration = 12;
  double cooldown = 13;
  double chance = 14;
  int32 extra_attack = 15;
  double stack_ap = 16;
  double interval = 17;
  string icon = 18;
}

message TalentPick {
  int32 id = 1;
  int32 rank = 2;
}

message Encounter {
  double duration_seconds = 1;
  // Unspecified (0) is Patchwerk: 7700 armor, no mechanics.
  double armor = 2;
}

message SimOptions {
  int32 iterations = 1;
  int64 rng_seed = 2;
}

message SimResult {
  double dps_mean = 1;
  double dps_stdev = 2;
  double dps_min = 3;
  double dps_max = 4;
  int32 iterations = 5;
  repeated ActionMetric actions = 6;
  repeated string modifiers = 7;
  // Cast log from the first iteration so the UI can draw a combat timeline.
  repeated TimelineEvent timeline = 8;
  // One DPS sample per iteration, used for the result histogram.
  repeated double iteration_dps = 9;
}

message ActionMetric {
  string name = 1;
  double dps = 2;
  // Mean per iteration. Fractional when the ability is not used every fight.
  double casts = 3;
  double crits = 4;
  double misses = 5;
  string icon = 6;
  double hit_dps = 7;
  double crit_dps = 8;
  // Mean damage per cast, including misses as 0.
  double avg_cast = 9;
}

message TimelineEvent {
  double time_seconds = 1;
  string name = 2;
  double damage = 3;
  bool crit = 4;
  bool miss = 5;
  string icon = 6;
  // Remaining rage/energy after this event. Empty kind means no resource bar.
  string resource_kind = 7;
  double resource = 8;
  // hit, tick, dot, buff, or cast. Empty is treated as a hit.
  // Cast events use time_seconds as the start and duration_seconds as the hard-cast length;
  // the matching hit is emitted when the cast lands.
  string kind = 9;
  double duration_seconds = 10;
}

message StatWeight {
  string id = 1;
  string name = 2;
  // Mean DPS gained from one unit of this stat (1% for hit/crit).
  double dps = 3;
  // DPS weight divided by the class reference stat (AP or spell power).
  double ep = 4;
}

message StatWeightsResult {
  string reference_id = 1;
  string reference_name = 2;
  double baseline_dps = 3;
  int32 iterations = 4;
  repeated StatWeight weights = 5;
}

enum WarriorStance {
  WARRIOR_STANCE_UNSPECIFIED = 0;
  WARRIOR_STANCE_BATTLE = 1;
  WARRIOR_STANCE_BERSERKER = 2;
  WARRIOR_STANCE_DEFENSIVE = 3;
}

enum Class {
  CLASS_UNSPECIFIED = 0;
  CLASS_WARRIOR = 1;
  CLASS_PALADIN = 2;
  CLASS_HUNTER = 3;
  CLASS_ROGUE = 4;
  CLASS_PRIEST = 5;
  CLASS_SHAMAN = 6;
  CLASS_MAGE = 7;
  CLASS_WARLOCK = 8;
  CLASS_DRUID = 9;
}

enum Race {
  RACE_UNSPECIFIED = 0;
  RACE_HUMAN = 1;
  RACE_ORC = 2;
  RACE_DWARF = 3;
  RACE_NIGHT_ELF = 4;
  RACE_UNDEAD = 5;
  RACE_TAUREN = 6;
  RACE_GNOME = 7;
  RACE_TROLL = 8;
  RACE_SKYBORNE = 9;
}

enum ItemSlot {
  ITEM_SLOT_UNSPECIFIED = 0;
  ITEM_SLOT_HEAD = 1;
  ITEM_SLOT_NECK = 2;
  ITEM_SLOT_SHOULDER = 3;
  ITEM_SLOT_BACK = 4;
  ITEM_SLOT_CHEST = 5;
  ITEM_SLOT_WRIST = 6;
  ITEM_SLOT_HANDS = 7;
  ITEM_SLOT_WAIST = 8;
  ITEM_SLOT_LEGS = 9;
  ITEM_SLOT_FEET = 10;
  ITEM_SLOT_FINGER_1 = 11;
  ITEM_SLOT_FINGER_2 = 12;
  ITEM_SLOT_TRINKET_1 = 13;
  ITEM_SLOT_TRINKET_2 = 14;
  ITEM_SLOT_MAIN_HAND = 15;
  ITEM_SLOT_OFF_HAND = 16;
  ITEM_SLOT_RANGED = 17;
}
